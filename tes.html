<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background dekorasi -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>


    <!-- Kotak Login -->
    <div class="login-box">

        <div class="icon">
            🔐
        </div>

        <h1>Selamat Datang</h1>

        <p class="subtitle">
            Silakan masuk untuk melanjutkan
        </p>


        <form onsubmit="login(event)">

            <!-- Username -->

            <label>👤 Username</label>

            <input
                type="text"
                id="username"
                placeholder="Masukkan username"
                required
            >


            <!-- Password -->

            <label>🔑 Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    required
                >

                <button
                    type="button"
                    class="eye-button"
                    onclick="togglePassword()"
                    id="eyeButton">
                    👁️
                </button>

            </div>


            <!-- Ingat saya -->

            <div class="remember">

                <label>
                    <input type="checkbox">
                    Ingat saya
                </label>

                <a href="#">
                    Lupa password?
                </a>

            </div>


            <!-- Tombol -->

            <button type="submit">
                🚀 MASUK
            </button>

        </form>


        <div class="divider">
            <span>atau</span>
        </div>


        <p class="register">
            Belum punya akun?
            <a href="#">
                Daftar sekarang
            </a>
        </p>

    </div>


    <!-- JavaScript -->
    <script src="login.js"></script>

</body>
</html>
